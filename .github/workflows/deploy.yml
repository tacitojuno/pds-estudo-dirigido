name: Deploy MyST Site

on:
  push:
    branches: [main]

# Permissões necessárias para o método do GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar MyST
        run: npm install -g mystmd

      - name: Construir o site HTML
        run: myst build --html

      - name: Fazer upload do artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

      - name: Fazer o deploy para o GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4